name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  # Cancel stale in-progress PR runs, but never cancel a run on main: two commits
  # landing in quick succession must each keep their own pass/fail signal.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Both jobs only check out and run tests — no writes to the repo, releases, or PRs.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -q

  xcode:
    name: Xcode app (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: QuickInterviewEditor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      # Installs Ruby, runs `bundle install`, and caches the gem bundle
      # (the full fastlane graph) between runs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: QuickInterviewEditor

      - name: Install tooling (XcodeGen + SwiftLint)
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen generate

      - name: swift-format check
        run: bundle exec fastlane mac format_check

      - name: SwiftLint
        run: bundle exec fastlane mac lint_code

      - name: Run tests
        run: bundle exec fastlane mac test

  validate:
    name: Validate release scripts + versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cheap release-pipeline guards only — CI never builds/signs/notarizes the
      # DMG (Decision 3: the multi-GB engine freeze runs locally).
      - name: Ruby syntax-check the appcast generator
        run: ruby -c packaging/appcast.rb

      - name: Packaging scripts are executable
        run: |
          test -x packaging/make-dmg.sh
          test -x packaging/sign-app.sh
          test -x packaging/appcast.rb

      - name: Version fields are well-formed (integer build, semver marketing)
        run: |
          grep -Eq 'CURRENT_PROJECT_VERSION: "[0-9]+"' QuickInterviewEditor/project.yml
          grep -Eq 'MARKETING_VERSION: "[0-9]+\.[0-9]+\.[0-9]+"' QuickInterviewEditor/project.yml

      - name: Appcast (if ever committed) parses as XML
        run: |
          if [ -f packaging/dist/appcast.xml ]; then
            ruby -rrexml/document -e 'abort "bad appcast" unless REXML::Document.new(File.read("packaging/dist/appcast.xml")).root'
          else
            echo "no committed appcast (expected — packaging/dist is gitignored)"
          fi
